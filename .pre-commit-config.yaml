repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: local
    hooks:
      - id: prettier
        name: Prettier format check
        entry: npx prettier --check
        language: system
        types_or: [ts, tsx, json, markdown]
        pass_filenames: true

      - id: tsc
        name: TypeScript type check
        entry: bash -c "cd /home/mmber/banxe-platform && pnpm typecheck"
        language: system
        pass_filenames: false
        always_run: true

      - id: vitest
        name: Vitest unit tests
        entry: bash -c "cd /home/mmber/banxe-platform && pnpm test"
        language: system
        pass_filenames: false
        always_run: true
